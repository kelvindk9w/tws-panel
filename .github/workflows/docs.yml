# Documentation site (Starlight) → GitHub Pages.
#
#  - Pull requests that touch the docs only BUILD the site and check the links
#    (no publishing, no permissions beyond reading the code).
#  - The site is PUBLISHED only on push to main.
#
# Segurança (docs/internal/github-security.md §4):
#  - permissões mínimas por job (o publish é o único com pages/id-token: write);
#  - TODAS as actions pinadas por SHA completo (com a versão em comentário);
#  - sem secrets.
#
# Pré-requisito manual (uma vez): Settings → Pages → Source = "GitHub Actions".
name: docs

on:
  # Build manual (só confere e compila); o deploy continua exclusivo do push para main.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "scripts/check-doc-links.mjs"
      - "scripts/check-site-url.mjs"
      - "scripts/site-config.mjs"
      - "apps/web/src/lib/links.ts"
      - ".github/ISSUE_TEMPLATE/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "scripts/check-doc-links.mjs"
      - "scripts/check-site-url.mjs"
      - "scripts/site-config.mjs"
      - "apps/web/src/lib/links.ts"
      - ".github/ISSUE_TEMPLATE/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versão do pnpm vem do campo packageManager do package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22 (cache do pnpm)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install (só o site)
        run: pnpm install --frozen-lockfile --filter site...

      - name: Check internal links
        run: node scripts/check-doc-links.mjs

      - name: Check the site address in READMEs and templates
        run: node scripts/check-site-url.mjs

      - name: Build site
        run: pnpm --filter site build

      - name: Check build output (alerts, asides)
        run: pnpm --filter site check:build

      - name: Check absolute site URLs against the build
        run: node scripts/check-doc-links.mjs --require-dist

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
