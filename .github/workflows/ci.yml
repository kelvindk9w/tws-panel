# CI — install → typecheck → build → testes unitários com cobertura.
# Os thresholds de cobertura (vitest.config.ts de cada package) fazem o CI
# falhar se a cobertura regredir.
#
# Segurança (docs/github-security.md §4):
#  - permissões mínimas explícitas (contents: read);
#  - TODAS as actions pinadas por SHA completo (com a versão em comentário);
#  - sem secrets: PRs de fork rodam este workflow sem acesso a nada sensível.
#
# Os E2E (pnpm test:e2e) ficam fora do CI por exigirem Docker com containers
# privilegiados — rodam localmente antes do merge de mudanças de infra.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versão do pnpm vem do campo packageManager do package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22 (cache do pnpm)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests (com cobertura e thresholds)
        run: pnpm test:coverage

  # Scan de vulnerabilidades da imagem de produção (Trivy).
  # Política atual: REPORT-ONLY (exit-code 0) para severidades HIGH/CRITICAL
  # com fix disponível — o relatório fica no log do job. Decisão documentada:
  # falharemos o CI em CRITICAL assim que o baseline da imagem estiver limpo
  # (hoje o Debian slim traz findings residuais sem fix upstream).
  image-scan:
    name: image-scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem de produção
        run: docker build -t tws-panel:ci .

      - name: Trivy — HIGH/CRITICAL da imagem (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tws-panel:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
