# CI — install → typecheck → build → testes unitários com cobertura.
# Os thresholds de cobertura (vitest.config.ts de cada package) fazem o CI
# falhar se a cobertura regredir.
#
# Segurança (docs/internal/github-security.md §4):
#  - permissões mínimas explícitas (contents: read);
#  - TODAS as actions pinadas por SHA completo (com a versão em comentário);
#  - o único secret é CHECK_REAL_HOSTS_PATTERNS (lista de nomes proibidos, opcional); PRs de fork não o
#    recebem e rodam sem acesso a nada sensível.
#
# Os E2E (pnpm test:e2e) ficam fora do CI por exigirem Docker com containers
# privilegiados — rodam localmente antes do merge de mudanças de infra.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versão do pnpm vem do campo packageManager do package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22 (cache do pnpm)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # CHECK_REAL_HOSTS_PATTERNS: secret opcional com regex (um por linha) de nomes que não podem aparecer.
      # PR de fork não recebe secrets: roda sem ele, vazio, e não falha por isso.
      - name: Dados reais no repositório (IPs, domínios, hostnames, nomes protegidos)
        env:
          CHECK_REAL_HOSTS_PATTERNS: ${{ secrets.CHECK_REAL_HOSTS_PATTERNS }}
        run: node scripts/check-no-real-hosts.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests (com cobertura e thresholds)
        run: pnpm test:coverage

  # Autoria dos commits NOVOS do PR: reprova autor ou coautor "Teste" / teste@exemplo.com
  # (identidade de ambiente de teste que já escapou para o main). Só olha o intervalo do PR/push; no PR e no
  # push do dev o que já está em origin/main fica de fora (já foi conferido ao entrar lá e não tem mais conserto).
  commit-authors:
    name: commit-authors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PR: os commits do PR. Push em main: o que entrou (inclusive a mensagem do squash, onde o GitHub põe
      # "Co-authored-by"). Push em dev: o que entrou, menos o que já está no main (squash anterior trazido pela
      # reconciliação). Base só com zeros = branch nova: o script confere o último commit. Se origin/main não
      # existir, o script avisa e segue sem a exclusão.
      - name: Autor e coautor dos commits novos
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          EXCLUIR_REF: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && 'origin/main' || '' }}
        run: node scripts/check-commit-authors.mjs "$BASE_SHA" "$HEAD_SHA" "$EXCLUIR_REF"

  # Scan de vulnerabilidades da imagem de produção (Trivy).
  # Política: CRITICAL com fix disponível BLOQUEIA o merge (exit-code 1).
  # HIGH continua report-only (exit-code 0) — visibilidade sem travar o PR
  # por severidade menor. `ignore-unfixed` já tira da mesa CVE sem correção
  # publicada; a allowlist abaixo é só para o caso raro de CVE CRITICAL COM
  # fix disponível mas fora do nosso controle (ex.: dependência interna da
  # própria imagem base, que não é gerenciada pelo nosso pnpm-lock.yaml).
  image-scan:
    name: image-scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem de produção
        run: docker build -t tws-panel:ci .

      # Allowlist explícita de CVEs CRITICAL conhecidos sem correção possível
      # da nossa parte. Cada entrada precisa do porquê e de quando foi revista
      # — isso aqui é uma exceção, não um lugar para acumular ruído.
      - name: Allowlist de CVEs CRITICAL sem correção possível (documentada)
        run: |
          cat <<'EOF' > .trivyignore
          # Allowlist de CVE CRITICAL que não está sob nosso controle direto.
          # Revisar a cada atualização da imagem base ou das dependências.
          #
          # CVE-2026-59873 (tar 7.5.10/7.5.11 → fix em 7.5.19)
          # Não é dependência do nosso pnpm-lock.yaml: é o `tar` vendorizado
          # dentro do npm que já vem embutido em node:22-bookworm-slim. Sai
          # sozinho quando a imagem base atualizar o npm.
          CVE-2026-59873
          #
          # CVE-2025-68121 (stdlib Go do binário do esbuild)
          # O esbuild é ferramenta de BUILD (dependência transitiva do Vite) e
          # nunca é executado em runtime — o painel roda o servidor Fastify, não
          # o bundler. Ele só aparece no scan porque a imagem de runtime copia o
          # estágio de build inteiro, node_modules incluído (Dockerfile:87).
          # A correção de raiz é não levar devDependencies para a imagem final,
          # o que reduziria também o tamanho e a superfície de ataque; está
          # mantido aqui como dívida técnica conhecida.
          CVE-2025-68121
          #
          # CVE-2026-56857 (stdlib Go 1.23.12 do binário do esbuild 0.25.12)
          # Root.Mkdir(All) seguindo junctions para fora da raiz: afeta SÓ o
          # Windows (junctions NTFS); a imagem roda em Linux. Mesmo binário de
          # build do CVE-2025-68121 acima, nunca executado em runtime. O docker
          # CLI e o compose já foram atualizados para versões com Go 1.26.10.
          # Revisar quando o Vite/esbuild do lockfile sair da série 0.25 (ou
          # quando o esbuild publicar binário com Go >= 1.26.9) e remover.
          CVE-2026-56857
          EOF

      - name: Trivy — CRITICAL da imagem (bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tws-panel:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

      - name: Trivy — HIGH da imagem (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tws-panel:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
