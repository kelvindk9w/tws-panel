name: Feature request
description: Suggest an improvement or a new feature
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. You can write in English or Portuguese (Brazil). Please check the
        [roadmap](https://github.com/kelvindk9w/tws-panel/blob/main/ROADMAP.md) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which real pain does this solve? For example "every time I do X I need to do Y".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including "do nothing".
  - type: textarea
    id: alignment
    attributes:
      label: Fit with the project
      description: TWS Panel is intentionally light and minimalist. Does this keep the VPS lean and the panel simple?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on a pull request for this.
