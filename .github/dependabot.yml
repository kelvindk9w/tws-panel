# Atualizações de versão semanais. Minor e patch vão agrupados em um PR por ecossistema; as major ficam
# em PRs separados (uma major quebrada não derruba o PR inteiro).
# Os alertas de segurança do Dependabot são independentes deste arquivo (ligados nas configurações do repositório).
version: 2
updates:
  - package-ecosystem: npm # cobre o workspace pnpm (pnpm-lock.yaml na raiz)
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Espera 7 dias após a publicação antes de propor a versão (pacotes recém-publicados e
    # depois retirados ou corrigidos não chegam aqui).
    cooldown:
      default-days: 7
    # Estas majors exigem migração planejada (Vite 7, Tailwind 4, ...) e são feitas à mão.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Subir de LTS (ex.: node 22 -> 24) é decisão manual; só patch/minor da linha atual.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(docker)"
