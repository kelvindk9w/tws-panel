# TWS Panel — PRODUÇÃO.
#
# Sobe o painel (API + SPA) na porta 9000, 100% em Docker:
#   docker compose up -d --build
#
# O container monta o socket do Docker do host (para gerenciar Caddy,
# Stalwart e os projetos implantados) e persiste todo o estado no volume
# paas_data (/data: setup-state, SQLite/JSONs).
#
# O SETUP_TOKEN pode ser passado via ambiente; se ausente, o painel lê o
# arquivo gerado pelo install.sh dentro do volume (veja scripts/install.sh).
services:
  panel:
    build: .
    image: tws-panel:latest
    container_name: tws-panel
    restart: unless-stopped
    ports:
      - "${PAAS_PORT:-9000}:9000"
    environment:
      NODE_ENV: production
      PORT: "9000"
      PAAS_DATA_DIR: /data
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SETUP_TOKEN_FILE: /data/setup-token
      PAAS_TARGET: ${PAAS_TARGET:-host}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Metadados do HOST (somente leitura): o container roda Debian (imagem
      # node:*-slim), então /etc/os-release local NÃO reflete a VPS real.
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - paas_data:/data

volumes:
  paas_data:
    # Nome fixo (independe do diretório do projeto) — facilita backup e o
    # install.sh, que lê/grava o setup token diretamente neste volume.
    name: paas_data
