# TWS Panel — PRODUÇÃO.
#
# Sobe o painel (API + SPA) na porta 9000, 100% em Docker:
#   docker compose up -d --build
#
# O container monta o socket do Docker do host (para gerenciar Caddy,
# Stalwart e os projetos implantados) e persiste todo o estado no volume
# paas_data (/data: setup-state, SQLite/JSONs).
#
# O SETUP_TOKEN pode ser passado via ambiente; se ausente, o painel lê o
# arquivo gerado pelo install.sh dentro do volume (veja scripts/install.sh).
#
# ── HOST BRIDGE (scan/hardening da VPS real) ──────────────────────────────
# Com PAAS_TARGET=host (padrão), o módulo de segurança NÃO executa nada no
# namespace deste container: ele sobe um helper DESCARTÁVEL privilegiado
# (`docker run --rm --privileged --pid=host alpine nsenter -t 1 -m -u -i -n -p`)
# que entra nos namespaces do PID 1 do host — padrão Coolify/Portainer.
# Somente comandos da allowlist (checks do scanner + scripts de
# scripts/hardening/*) são executados, tudo auditado. docs/host-bridge.md.
#
# ── HARDENING DESTE CONTAINER (o painel é o exemplo) ─────────────────────
#  - usuário não-root (tws, ver Dockerfile) + group_add do GID do docker.sock;
#  - no-new-privileges: nenhum processo do container escala privilégio;
#  - cap_drop ALL sem cap_add: o cliente Docker NÃO precisa de capabilities —
#    ele apenas fala com o socket; quem confere --privileged ao helper é o
#    daemon do host (que já é alcançável pelo socket de qualquer forma);
#  - read_only: rootfs imutável; os únicos diretórios graváveis são /data
#    (volume de estado), /tmp (tmpfs volátil) e o diretório dos projetos
#    (PAAS_PROJECTS_DIR, bind mount do host — veja o comentário em volumes).
services:
  panel:
    build: .
    image: tws-panel:latest
    container_name: tws-panel
    restart: unless-stopped
    ports:
      - "${PAAS_PORT:-9000}:9000"
    environment:
      NODE_ENV: production
      PORT: "9000"
      PAAS_DATA_DIR: /data
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SETUP_TOKEN_FILE: /data/setup-token
      PAAS_TARGET: ${PAAS_TARGET:-host}
      # Mesmo caminho da montagem abaixo — o processo precisa enxergar a
      # variável, senão volta ao default antigo (/data/projects).
      PAAS_PROJECTS_DIR: ${PAAS_PROJECTS_DIR:-/opt/tws-projects}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # GID do grupo dono do /var/run/docker.sock no host (o install.sh grava
    # no .env automaticamente; manual: DOCKER_GID=$(stat -c %g /var/run/docker.sock))
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Metadados do HOST (somente leitura): o container roda Debian (imagem
      # node:*-slim), então /etc/os-release local NÃO reflete a VPS real.
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      # Código dos projetos implantados: diretório REAL do host, montado com o
      # MESMO caminho dentro e fora do container. Isso não é capricho: o
      # deploy roda `docker compose --project-directory <esse caminho>`, e
      # quem resolve os bind mounts declarados no compose do usuário
      # (`./dados:/app/dados`, por exemplo) é o daemon Docker DO HOST. Um
      # caminho que existisse só dentro do container faria o daemon criar um
      # diretório vazio no host — o projeto subiria sem os dados dele.
      # De quebra, o operador inspeciona os arquivos por SSH sem entrar em
      # container nenhum. O install.sh cria o diretório com dono 10001:10001
      # (o usuário não-root do painel); o rootfs é somente-leitura, mas um
      # bind mount continua gravável.
      - ${PAAS_PROJECTS_DIR:-/opt/tws-projects}:${PAAS_PROJECTS_DIR:-/opt/tws-projects}
      - paas_data:/data

volumes:
  paas_data:
    # Criado pelo install.sh antes da primeira subida (para gravar o setup
    # token). external: true evita o aviso de "volume não criado pelo compose".
    name: paas_data
    external: true
