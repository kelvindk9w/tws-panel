packages:
  - "apps/*"
  - "packages/*"
  # Site de documentação (Starlight). Fora da imagem Docker (ver .dockerignore)
  # e dos scripts recursivos do painel (build/typecheck filtram "!site").
  - "site"
# pnpm 10+ bloqueia postinstall por padrão; o esbuild (Vite/tsx) precisa do
# script de build para instalar o binário nativo.
onlyBuiltDependencies:
  - esbuild
